<!DOCTYPE html>
<!-- Marisol Heat - an original top-down open-world crime game in vanilla JS.
     One canvas, no libraries, no assets, no network. Open this file (or serve
     the folder with `node serve.ts`) and play. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marisol Heat</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0d12; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #4d7c43; box-shadow: 0 0 60px rgba(0,0,0,0.6); }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
